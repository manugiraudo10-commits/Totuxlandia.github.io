<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totuxlandia - Portal Oficial</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12181b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2a323d;
            padding: 2.5rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            max-width: 400px;
            width: 85%;
        }
        h1 {
            color: #f1c40f;
            margin-bottom: 10px;
        }
        p {
            color: #bdc3c7;
            line-height: 1.5;
        }
        .btn-join {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 14px 28px;
            margin-top: 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background 0.3s ease;
        }
        .btn-join:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐢 Totuxlandia 🐢</h1>
        <p>¡Bienvenido a la comunidad oficial! Haz clic en el botón para unirte a nuestro espacio digital.</p>
        
        <a href="TU_ENLACE_AQUI" class="btn-join" target="_blank">Unirme a Totuxlandia</a>
    </div>
</body>
</html>
